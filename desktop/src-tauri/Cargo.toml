[package]
name = "mindforge-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "MindForge"
path = "src/main.rs"

[lib]
name = "mindforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
debug = 1
